[server]
headless = false
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#080C14"
secondaryBackgroundColor = "#0F172A"
textColor = "#F1F5F9"
linkColor = "#38BDF8"
borderColor = "rgba(255, 255, 255, 0.12)"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeTextColor = "#38BDF8"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["34px", "26px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

chartCategoricalColors = ["#38BDF8", "#818CF8", "#C084FC", "#34D399", "#F472B6", "#FBBF24", "#94A3B8"]

[theme.sidebar]
backgroundColor = "rgba(11, 15, 25, 0.95)"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "rgba(255, 255, 255, 0.08)"
primaryColor = "#38BDF8"
